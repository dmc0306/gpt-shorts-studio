name: Apply Vision regression test repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-vision-test-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Refresh Vision app regression tests
        run: python3 tool/patch_vision_test_fix.py
      - name: Commit source ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "Already patched"; exit 1; }
          git commit -m "Fix Vision benchmark test runner stall"
          git push
