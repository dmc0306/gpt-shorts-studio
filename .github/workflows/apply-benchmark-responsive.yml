name: Apply benchmark responsive search fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-benchmark-responsive.yml'
      - 'tool/patch_benchmark_responsive.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Patch bounded one-click search
        run: python3 tool/patch_benchmark_responsive.py
      - name: Commit updated Android source archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No source updates"; exit 1; }
          git commit -m "Fix one-click hanging state with cancellation and live per-card progress"
          git push
