name: Validate daily automated Shorts production
on:
  push:
    branches: [feat/daily-discover-produce-publish-20261112]
    paths:
      - 'automation/**'
      - '.github/workflows/validate-daily-auto-publish.yml'
      - '.github/workflows/daily-auto-publish.yml'
      - '.github/workflows/configure-daily-publish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/validate-daily-auto-publish.yml'
      - '.github/workflows/daily-auto-publish.yml'
      - '.github/workflows/configure-daily-publish.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pure schedule and Unicode validator
        run: python -m pip install 'regex>=2024.11'
      - name: Python syntax validation
        run: python -m compileall -q automation/
      - name: Scheduler, dedupe, title and uncertain-upload tests
        run: python -m unittest discover -s automation -p 'test_*.py' -v
      - name: Validate disabled-by-default configuration
        run: python automation/daily_pipeline.py validate
