name: Inspect benchmark integration points
on:
  push:
    paths:
      - '.github/workflows/inspect-benchmark.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print selected source interfaces (no private config)
        run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile("shorts-studio-source.zip")
          names=z.namelist()
          print("SOURCEFILES")
          for n in names:
            if n.endswith((".dart",".yaml",".md")) and not n.startswith("test/"):
              print(n)
          targets=("lib/model.dart","lib/discovery.dart","lib/discovery_store.dart","lib/auto_batch.dart","lib/ai.dart","lib/tiktok_download.dart","lib/editor.dart","lib/scene_selection.dart","lib/main.dart")
          for n in targets:
            if n not in names:continue
            lines=z.read(n).decode('utf-8').splitlines()
            print("SOURCE",n,"LINES",len(lines))
            if n in ("lib/model.dart","lib/discovery_store.dart","lib/discovery.dart","lib/tiktok_download.dart","lib/scene_selection.dart"):
              index=set(range(min(len(lines),320)))
            else:
              index=set()
              for i,l in enumerate(lines):
                if any(k in l.lower() for k in ("widget ","class ","future<","apikey","search","process","generate","file","import","video","navigator","build(")):
                  index.update(range(max(0,i-2),min(len(lines),i+12)))
            for i in sorted(index)[:220]:
              print(f"{i+1:4d} | {lines[i][:600]}")
          PY
