name: Inspect benchmark integration points
on:
  push:
    paths:
      - '.github/workflows/inspect-benchmark.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print selected source interfaces (no private config)
        run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile("shorts-studio-source.zip")
          names=z.namelist()
          print("SOURCEFILES")
          for n in names:
            if n.endswith((".dart",".yaml",".md")) and not n.startswith("test/"):
              print(n)
          targets=("lib/main.dart","lib/home.dart","lib/bridge.dart","lib/ai_settings.dart","lib/model.dart","lib/collector.dart","lib/search.dart","lib/youtube.dart","lib/youtube_settings.dart","lib/youtube_channel.dart","lib/youtube_upload.dart","pubspec.yaml")
          for n in targets:
            if n not in names:continue
            lines=z.read(n).decode('utf-8').splitlines()
            print("SOURCE",n,"LINES",len(lines))
            if n in ("lib/main.dart","lib/home.dart","lib/bridge.dart","lib/ai_settings.dart","pubspec.yaml"):
              index=set(range(min(len(lines),220)))
            else:
              index=set()
              for i,l in enumerate(lines):
                if any(k in l.lower() for k in ("widget ","class ","future<","apikey","search","process","generate","file","import","video","navigator","build(")):
                  index.update(range(max(0,i-2),min(len(lines),i+7)))
            for i in sorted(index)[:370]:
              print(f"{i+1:4d} | {lines[i][:240]}")
          PY
