name: Validate standalone Android daily headless producer
on:
  push:
    branches: [feat/headless-android-daily-producer-20261114]
    paths:
      - 'tool/daily_headless_runner.dart'
      - 'tool/AndroidHeadlessDailyRunner.kt'
      - 'tool/HeadlessDailyMedia.kt'
      - 'tool/AndroidDailyScheduler.kt'
      - 'tool/patch_android_daily_headless.py'
      - '.github/workflows/validate-headless-daily.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tool/daily_headless_runner.dart'
      - 'tool/AndroidHeadlessDailyRunner.kt'
      - 'tool/HeadlessDailyMedia.kt'
      - 'tool/AndroidDailyScheduler.kt'
      - 'tool/patch_android_daily_headless.py'
      - '.github/workflows/validate-headless-daily.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Patch packaged source
        run: |
          python3 tool/patch_android_daily_headless.py
          unzip -q shorts-studio-source.zip -d app
          grep -q '^version: 0.21.26+85' app/pubspec.yaml
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Flutter native app
        working-directory: app
        run: python3 tool/bootstrap.py
      - name: Flutter static analysis
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter regression suite
        working-directory: app
        run: flutter test
      - name: Kotlin/Android build with independent headless engine
        working-directory: app
        run: flutter build apk --debug
