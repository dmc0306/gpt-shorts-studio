name: Validate source-candidate caption screening
on:
  pull_request:
    branches: [main]
    paths:
      - 'tool/benchmark_oneclick.dart'
      - 'tool/benchmark_ui.dart'
      - 'tool/benchmark_data.dart'
      - 'tool/benchmark_tests.dart'
      - 'tool/patch_caption_verification.py'
      - '.github/workflows/validate-caption-verification.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Package candidate-caption guard to disposable app
        run: |
          if unzip -p shorts-studio-source.zip pubspec.yaml | grep -Fq 'version: 0.21.17+76'; then
            python3 tool/patch_caption_verification.py
          else
            echo "Caption verification already included in the versioned app"
          fi
          unzip -q shorts-studio-source.zip -d app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap
        working-directory: app
        run: python3 tool/bootstrap.py
      - name: Flutter static analysis
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        working-directory: app
        run: flutter test
