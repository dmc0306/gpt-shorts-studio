name: Package validated YouTube batch feedback source
on:
  push:
    branches: [fix/youtube-batch-auth-status]
    paths: ['.github/workflows/package-batch-source-fast.yml']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply checked patch
        run: |
          python3 tool/patch_batch_auth_feedback.py
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('shorts-studio-source.zip') as z:
              assert b'version: 0.21.27+86' in z.read('pubspec.yaml')
              assert b'youtubeBatchOutcomeMessage' in z.read('lib/youtube_batch_publish_screen.dart')
          print('Archive verified')
          PY
      - name: Commit and publish source archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && exit 0
          git commit -m "Package v0.21.27 truthful YouTube batch upload status"
          git fetch origin fix/youtube-batch-auth-status
          git rebase origin/fix/youtube-batch-auth-status
          git push origin HEAD:fix/youtube-batch-auth-status
