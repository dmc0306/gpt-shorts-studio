name: Integrate Vision diagnostics and central-frame crop
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-vision-diagnostics.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch versioned app sources
        run: python3 tool/patch_vision_diagnostics.py
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Show image-index failure diagnostics and better central frame cropping"
          git push
