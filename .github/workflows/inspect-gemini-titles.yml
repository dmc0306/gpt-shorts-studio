name: Inspect title prompt rules
on:
  push:
    branches: [feat/gemini-viral-titles-strict-length-20261111]
    paths: ['.github/workflows/inspect-gemini-titles.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual title rules and tests
        run: |
          unzip -q shorts-studio-source.zip -d /tmp/source
          cd /tmp/source
          echo 'AI RULES BEGIN'
          cat lib/ai_rules.dart
          echo 'AI RULES END'
          echo 'EXISTING HEADLINE TESTS BEGIN'
          sed -n '1,140p' test/title_regeneration_test.dart
          echo 'EXISTING HEADLINE TESTS END'
          echo 'PROMPT USAGE'
          grep -R -n 'titleRules\|headlineLineMinimum\|headlineLineLimit\|validHeadline' lib test | head -80
