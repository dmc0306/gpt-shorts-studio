name: Inspect Gemini code segments
on:
  push:
    branches: [feat/gemini-viral-titles-strict-length-20261111]
    paths: ['.github/workflows/inspect-gemini-titles.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract AI prompt and title constraints
        shell: bash
        run: |
          unzip -q shorts-studio-source.zip -d /tmp/source
          cd /tmp/source
          echo '=== AI FILE STATS ==='
          wc -l lib/ai.dart lib/headline.dart test/title_regeneration_test.dart
          echo '=== AI SYMBOLS ==='
          grep -nE 'prompt|title|Title|headline|Headline|5.{0,8}11|retry|regenerate|decodeTitles|curiosity|twist|humor|generateContent' lib/ai.dart | head -190 || true
          echo '=== HEADLINE FILE ==='
          sed -n '1,200p' lib/headline.dart
          echo '=== AI FILE A ==='
          sed -n '1,320p' lib/ai.dart
          echo '=== AI FILE B ==='
          sed -n '321,680p' lib/ai.dart
