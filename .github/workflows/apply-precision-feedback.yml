name: Apply evidence-first original candidate precision
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-precision-feedback.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Package precision and feedback changes
        run: python3 tool/patch_precision_feedback.py
      - name: Commit versioned Flutter source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Prioritize real image-match evidence and remember source review decisions"
          git push
