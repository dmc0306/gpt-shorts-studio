name: Apply OCR crop recheck and Lens fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ocr-recheck.yml'
      - 'tool/BenchmarkOcrCrop.kt'
      - 'tool/BenchmarkFrameExtractor.kt'
      - 'tool/patch_ocr_recheck.py'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Package source only on OCR predecessor version
        run: |
          if unzip -p shorts-studio-source.zip pubspec.yaml | grep -Fq 'version: 0.21.16+75'; then
            python3 tool/patch_ocr_recheck.py
          fi
      - name: Commit application ZIP if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No update"; exit 0; }
          git commit -m "Package OCR crop source version"
          git push
