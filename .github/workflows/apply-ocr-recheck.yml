name: Apply OCR crop recheck and Lens fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ocr-recheck.yml'
      - 'tool/BenchmarkOcrCrop.kt'
      - 'tool/BenchmarkFrameExtractor.kt'
      - 'tool/benchmark_ui.dart'
      - 'tool/patch_ocr_recheck.py'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Package updated source
        run: python3 tool/patch_ocr_recheck.py
      - name: Commit application ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No update"; exit 0; }
          git commit -m "Package v0.21.17 double OCR search and Lens crop"
          git push
