name: Apply YouTube stream frame source stage 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-stream.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install bounded video-only YouTube stream source
        run: python3 tool/patch_stream.py
      - name: Commit source ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "Source archive unchanged"; exit 1; }
          git commit -m "Stage 1: acquire YouTube stream and automatically extract video frames"
          git push
