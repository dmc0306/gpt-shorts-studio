name: OAuth source inspection (temporary)
on:
  push:
    paths:
      - '.github/workflows/oauth-source-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source package without secrets
        run: |
          python3 - <<'PY'
          import zipfile, re, pathlib
          z=zipfile.ZipFile('shorts-studio-source.zip')
          names=z.namelist()
          print('SOURCE INDEX',len(names))
          for n in names:
              if any(k in n.lower() for k in ('auth','manifest','gradle','mainactivity','app.dart','settings','youtube','chrome','callback')):
                  if not n.endswith('/') and not '/build/' in n:
                      print('FILE', n)
          terms=('AUTH_CHROME_AUTHORIZE','RedirectUriReceiverActivity','appAuthRedirectScheme',
                 'getAuthorizationRequestIntent','performAuthorizationRequest',
                 'getAuthorizationResponse','chromeAuthorize','chrome_authorize',
                 'AuthorizationManagementActivity','chromeOAuth','authorizeWithChrome',
                 'authorization_code','net.openid.appauth','BrowserMatcher','redirectUri')
          for n in names:
              if n.endswith('/') or not n.endswith(('.dart','.kt','.java','.xml','.gradle','.properties','.md')) or any(t in n for t in ('/build/','/.dart_tool/','.pub-cache','/test/')): continue
              try: s=z.read(n).decode('utf-8')
              except: continue
              lines=s.splitlines()
              matches=[i for i,l in enumerate(lines) if any(t.lower() in l.lower() for t in terms)]
              if not matches: continue
              print('==== INSPECT',n,'LINES',len(lines),'MATCHES',len(matches))
              picked=set()
              for i in matches[:24]:
                  for j in range(max(0,i-18),min(len(lines),i+33)): picked.add(j)
              for j in sorted(picked)[:550]:
                  l=lines[j]
                  if len(l)>500:l=l[:500]+' ...'
                  print(f'{j+1:5d}: {l}')
          PY
      - name: Full targeted callback and bridge review
        run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('shorts-studio-source.zip')
          for n in ('native/android/YouTubeChromeAuth.kt','native/android/MainActivity.kt','lib/youtube_chrome.dart','lib/youtube_settings.dart','lib/youtube.dart','test/youtube_chrome_test.dart','test/youtube_integration_ui_test.dart','tool/bootstrap.py','YOUTUBE_CHROME_AUTH.md'):
              if n not in z.namelist():continue
              print('===== SOURCEFILE',n)
              s=z.read(n).decode('utf-8')
              lines=s.splitlines()
              if n in ('lib/youtube_settings.dart','lib/youtube.dart','test/youtube_integration_ui_test.dart'):
                  matches=[i for i,l in enumerate(lines) if any(k in l.lower() for k in ('chrome','oauth','youtube.connected','connectchrome'))]
                  idx=set()
                  for i in matches:
                      idx.update(range(max(0,i-7),min(len(lines),i+13)))
                  for i in sorted(idx)[:500]:print(f'{i+1:4d}: {lines[i]}')
              else:
                  for i,l in enumerate(lines[:600]):print(f'{i+1:4d}: {l}')
          PY
