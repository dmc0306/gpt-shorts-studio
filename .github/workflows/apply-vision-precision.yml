name: Apply strict image verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-vision-precision.yml'
      - 'tool/patch_vision_precision.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Patch image comparison and cached search results
        run: python3 tool/patch_vision_precision.py
      - name: Commit validated application ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "Nothing to patch"; exit 1; }
          git commit -m "Fix unrelated reverse image search suggestions in benchmark flow"
          git push
