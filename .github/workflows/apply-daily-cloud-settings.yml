name: Package cloud scheduling entry in Android settings
on:
  push:
    branches: [main]
    paths:
      - 'tool/patch_daily_cloud_settings.py'
      - '.github/workflows/apply-daily-cloud-settings.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update source archive
        run: python3 tool/patch_daily_cloud_settings.py
      - name: Commit versioned app source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Package v0.21.24 daily cloud settings entry"
          git push
