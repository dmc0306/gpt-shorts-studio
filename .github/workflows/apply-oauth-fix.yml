name: Apply reviewed Chrome OAuth callback patch
on:
  push:
    branches: [main]
    paths:
      - 'tool/patch_oauth_fix.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply patch to versioned source archive
        run: python3 tool/patch_oauth_fix.py
      - name: Commit patched source archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No source changes"; exit 1; }
          git commit -m "Fix Chrome OAuth callback diagnostics and add Custom Tab fallback"
          git push
