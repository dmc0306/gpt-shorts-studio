name: Validate YouTube upload & scheduling UI
on:
  pull_request:
    branches: [main]
    paths:
      - 'shorts-studio-source.zip'
      - 'tool/youtube_batch_publish_screen.dart'
      - 'tool/youtube_batch_outcome.dart'
      - 'tool/youtube_batch_outcome_test.dart'
      - '.github/workflows/validate-youtube-public-schedule.yml'
  push:
    branches: [main]
    paths:
      - 'shorts-studio-source.zip'
      - 'tool/youtube_batch_publish_screen.dart'
      - 'tool/youtube_batch_outcome.dart'
      - 'tool/youtube_batch_outcome_test.dart'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract production source (do not reapply legacy patch)
        run: |
          unzip -q shorts-studio-source.zip -d app
          test -f app/lib/youtube_batch_outcome.dart
          test -f app/test/youtube_batch_outcome_test.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Flutter
        working-directory: app
        run: python3 tool/bootstrap.py
      - name: Flutter static analysis
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: YouTube scheduled upload and error-state tests
        working-directory: app
        run: flutter test
