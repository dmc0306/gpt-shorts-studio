name: Inspect Android headless background production components
on:
  push:
    branches: [feat/headless-android-daily-producer-20261114]
    paths: ['.github/workflows/inspect-headless-components.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q shorts-studio-source.zip -d app
          cd app
          echo '=== BOOTSTRAP ==='
          sed -n '1,240p' tool/bootstrap.py
          echo '=== PUBSPEC ==='
          head -95 pubspec.yaml
          echo '=== HEADLESS CANDIDATE SOURCE ==='
          grep -R -n 'DartEntrypoint\|FlutterEngine\|backgroundFlutter' native lib || true
          echo '=== MANIFEST / DEPS ==='
          cat native/android/AndroidManifest.xml
          cat native/android/dependencies.gradle.kts
          echo '=== BRIDGE ==='
          cat lib/bridge.dart
          echo '=== MODEL ==='
          sed -n '1,210p' lib/model.dart
          echo '=== YOUTUBE UPLOAD ==='
          sed -n '260,530p' lib/youtube.dart
          echo '=== ORIGINAL SCANNER ==='
          head -180 native/android/OriginalTextScanner.kt
          echo '=== TIKTOK NATIVE REFERENCES ==='
          grep -n -C 3 "Native.call" lib/tiktok_download.dart lib/youtube_chrome.dart lib/discovery_store.dart
