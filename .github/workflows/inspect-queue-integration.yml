name: Inspect Android queue integration
on:
  push:
    branches: [feat/android-scheduled-queue-refill]
    paths: ['.github/workflows/inspect-queue-integration.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('shorts-studio-source.zip')
          for n in ['lib/main.dart','lib/bridge.dart','lib/model.dart','native/android/MainActivity.kt','native/android/HeadlessDailyMedia.kt','lib/youtube_settings.dart','lib/auto_batch.dart']:
              print('=== SOURCE',n)
              lines=z.read(n).decode().splitlines()
              if n in ('native/android/MainActivity.kt','native/android/HeadlessDailyMedia.kt'):
                  picked=set()
                  for i,l in enumerate(lines):
                      if i<115 or any(t in l for t in ['loadProjects','saveProjects','youtubeSettings','saveYoutubeSettings','onDestroy','batchStart','batchFinish','batchAwake','youtubeKeepAwake','youtubeUploadState','saveYoutubeUploadState','reserveDailySource','dailyUploadSuccess','pendingSourceId','dailyHistory']):
                          picked.update(range(max(0,i-5),min(len(lines),i+10)))
                  for i in sorted(picked): print(f'{i+1}: {lines[i]}')
              else:
                  for i,l in enumerate(lines): print(f'{i+1}: {l}')
          PY
