name: Apply known original ground-truth pair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-groundtruth-pair.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Package user-confirmed original mapping and shortlink support
        run: python3 tool/patch_groundtruth_pairs.py
      - name: Commit source archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No archive changes"; exit 1; }
          git commit -m "Preserve user-confirmed original and TikTok share URL support"
          git push
