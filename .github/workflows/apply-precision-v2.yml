name: Apply chronological candidate precision patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-precision-v2.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Integrate precision patch into Flutter source ZIP
        run: python3 tool/patch_precision_v2.py
      - name: Commit packaged source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Package v0.21.15 chronological source matching"
          git push
