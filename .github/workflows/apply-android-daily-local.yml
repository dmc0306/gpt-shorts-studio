name: Package Android local daily schedule
on:
  push:
    branches: [main]
    paths:
      - 'tool/patch_android_daily_local.py'
      - '.github/workflows/apply-android-daily-local.yml'
permissions: {contents: write}
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Update application source
        run: python3 tool/patch_android_daily_local.py
      - name: Commit versioned ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && exit 0
          git commit -m "Package v0.21.25 Android on-device daily schedule"
          git push
