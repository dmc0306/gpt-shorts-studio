name: Apply continuous original search patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-continuous-search.yml'
      - 'tool/patch_continuous_search.py'
      - 'tool/BenchmarkOcrCrop.kt'
      - 'tool/BenchmarkFrameExtractor.kt'
      - 'tool/benchmark_duration.dart'
      - 'tool/benchmark_oneclick.dart'
      - 'tool/benchmark_ui.dart'
      - 'tool/benchmark_tests.dart'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Package updated Android source
        run: python3 tool/patch_continuous_search.py
      - name: Commit source ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Package v0.21.16 continuous original search"
          git push
