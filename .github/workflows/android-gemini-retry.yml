name: Android signed APK - Gemini 503 retry
on:
  push:
    branches: [fix/gemini-503-retry-diagnostics, main]
    paths:
      - 'tool/patch_gemini_retry.py'
      - 'tool/gemini_retry.dart'
      - 'tool/gemini_retry_test.dart'
      - '.github/workflows/android-gemini-retry.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Package updated Gemini source
        working-directory: .
        run: python3 tool/patch_gemini_retry.py
      - name: Extract app source
        working-directory: .
        run: unzip -q shorts-studio-source.zip -d app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/signing.py restore
      - run: python3 -m unittest discover -s tool -p 'test_signing.py'
      - name: Test HTTPS authentication server
        run: |
          python3 -m pip install -r server/requirements.txt
          python3 -m unittest discover -s server -p 'test_*.py'
          mkdir -p build
          python3 -m unittest discover -s tool -p 'test_youtube_pc.py'
      - run: python3 tool/bootstrap.py
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build APK with fixed signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --debug
      - name: Verify fixed signing certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tool/signing.py verify build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Commit tested source archive to main
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shorts-studio-source.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Package Gemini 503 retry and diagnostics Android app'
          git push origin HEAD:main
      - name: Remove temporary signing key
        if: always()
        run: python3 tool/signing.py cleanup
