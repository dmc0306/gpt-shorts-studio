name: Inspect existing YouTube upload architecture
on:
  push:
    branches: [feat/public-scheduled-batch-upload-20261105]
    paths:
      - '.github/workflows/inspect-upload-architecture.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source modules (no credentials)
        run: |
          mkdir -p /tmp/shorts-recon
          unzip -q shorts-studio-source.zip -d /tmp/shorts-recon
          cd /tmp/shorts-recon
          printf '\n*** YOUTUBE MODULE FILES ***\n'
          find lib native/android test -maxdepth 2 -type f \( -iname '*youtube*' -o -iname '*upload*' -o -iname '*scheduler*' \) | sort
          printf '\n*** UPLOAD REFERENCES ***\n'
          rg -n -m 16 'publishAt|privacyStatus|youtubeUpload|uploadVideo|upload\(|automatic|schedule|youtube\.upload|resumable|YouTubeService|class YouTube|uploadQueue' lib native/android test 2>/dev/null | head -230 || true
          printf '\n*** YOUTUBE MODELS / UI ***\n'
          sed -n '1,340p' lib/youtube_channel.dart
          sed -n '1,360p' lib/youtube_panel.dart
          sed -n '240,640p' lib/youtube.dart
          sed -n '220,540p' lib/youtube_settings.dart
          printf '\n*** MAIN PUBLISH TRIGGERS ***\n'
          rg -n -C 8 'youtube\.upload|youtube\.automatic|YoutubePanel|YouTubePanel|automatic|youtubeSettings|YouTubeUpload' lib/main.dart lib/editor.dart lib/youtube.dart lib/youtube_panel.dart | head -400 || true
          printf '\n*** UPLOAD TESTS ***\n'
          sed -n '1,280p' test/youtube_upload_test.dart
          sed -n '1,260p' test/youtube_auto_batch_failure_test.dart
