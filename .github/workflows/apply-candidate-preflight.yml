name: Apply bounded candidate verification fallback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-candidate-preflight.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply platform failure handling to versioned source ZIP
        run: python3 tool/patch_candidate_preflight.py
      - name: Commit app source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Candidate fallback: fast thumbnail hint, stop repeated YT failures, open source links"
          git push
