name: Validate Windows twice-daily scheduler

on:
  pull_request:
    paths:
      - 'automation/windows_twice_daily.py'
      - 'automation/install_windows.ps1'
      - 'automation/test_windows_twice_daily.py'
      - 'automation/daily_core.py'
      - 'automation/requirements.txt'
      - '.github/workflows/validate-windows-twice-daily.yml'
  push:
    branches: [main]
    paths:
      - 'automation/windows_twice_daily.py'
      - 'automation/test_windows_twice_daily.py'
      - 'automation/daily_core.py'
      - 'automation/requirements.txt'
      - '.github/workflows/validate-windows-twice-daily.yml'

permissions:
  contents: read

jobs:
  offline-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependencies
        run: python -m pip install tzdata regex
      - name: Validate Python syntax and scheduled production tests
        run: |
          python -m compileall -q automation/daily_core.py automation/daily_pipeline.py automation/windows_twice_daily.py
          python automation/test_windows_twice_daily.py -v
      - name: Ensure no live upload attempted
        run: echo "Only network-free mocked tests. No upload credentials available."
