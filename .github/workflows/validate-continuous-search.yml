name: Validate continuous original search
on:
  pull_request:
    branches: [main]
    paths:
      - 'tool/benchmark_ui.dart'
      - 'tool/benchmark_oneclick.dart'
      - 'tool/benchmark_duration.dart'
      - 'tool/BenchmarkOcrCrop.kt'
      - 'tool/BenchmarkFrameExtractor.kt'
      - 'tool/benchmark_tests.dart'
      - 'tool/patch_continuous_search.py'
      - '.github/workflows/validate-continuous-search.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Patch source ZIP on isolated PR copy
        run: |
          if unzip -p shorts-studio-source.zip pubspec.yaml | grep -q '^version: 0.21.15+74$'; then
            python3 tool/patch_continuous_search.py
          else
            echo "Already on a later app version; skip old packaging."
          fi
          unzip -q shorts-studio-source.zip -d app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap
        working-directory: app
        run: python3 tool/bootstrap.py
      - name: Static analysis
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit and widget tests
        working-directory: app
        run: flutter test
