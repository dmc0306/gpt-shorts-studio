name: Package TikTok 10204 verification recovery
on:
  push:
    branches: [main]
    paths:
      - 'tool/patch_tiktok_manual_proof.py'
      - '.github/workflows/apply-tiktok-manual-proof.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Integrate versioned app source
        run: python3 tool/patch_tiktok_manual_proof.py
      - name: Commit source ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "Already integrated"; exit 0; }
          git commit -m "Package v0.21.21 TikTok local candidate proof"
          git push
