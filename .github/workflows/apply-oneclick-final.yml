name: Apply one-click global final integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-oneclick-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update versioned Android sources
        run: python3 tool/patch_oneclick_finish.py
      - name: Commit app source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Complete single-tap random source search, validation and editor flow"
          git push
