name: Apply OCR subtitle filtering and candidate duration gating
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ocr-duration.yml'
      - 'tool/patch_ocr_duration.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Package searchable subtitle-free windows and duration prefilter
        run: python3 tool/patch_ocr_duration.py
      - name: Commit app archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "Nothing changed"; exit 1; }
          git commit -m "OCR crop reference scenes and compare only same-length source candidates"
          git push
