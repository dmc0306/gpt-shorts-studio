name: Apply clean precision candidate release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-precision-clean.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Package cleaned Dart original search files
        run: python3 tool/patch_precision_tail.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No change"; exit 1; }
          git commit -m "Ship original-candidate precision with clean data source"
          git push
