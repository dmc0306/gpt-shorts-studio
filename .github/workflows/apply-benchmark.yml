name: Apply benchmark discovery sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-benchmark.yml'
      - 'tool/patch_benchmark.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch versioned Shorts Studio application ZIP
        run: python3 tool/patch_benchmark.py
      - name: Commit updated source archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "Nothing to commit"; exit 1; }
          git commit -m "Implement three-stage benchmark-to-template workflow"
          git push
