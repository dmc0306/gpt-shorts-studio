name: Validate and package batch OAuth upload feedback
on:
  push:
    branches: [fix/youtube-batch-auth-status]
    paths:
      - '.github/workflows/package-batch-auth.yml'
      - 'tool/patch_batch_auth_feedback.py'
      - 'tool/youtube_batch_publish_screen.dart'
      - 'tool/youtube_batch_outcome.dart'
      - 'tool/youtube_batch_outcome_test.dart'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch archive using guarded source anchors
        run: |
          python3 tool/patch_batch_auth_feedback.py
          unzip -q shorts-studio-source.zip -d app
          grep -q '^version: 0.21.27+86' app/pubspec.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap Flutter
        working-directory: app
        run: python3 tool/bootstrap.py
      - name: Analyze Dart
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests (including error-state regression)
        working-directory: app
        run: flutter test
      - name: Compile Android APK
        working-directory: app
        run: flutter build apk --debug
      - name: Commit validated source archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No source changes"; exit 0; }
          git commit -m "Package v0.21.27 upload status fix and Chrome auth preflight"
          git push origin HEAD:fix/youtube-batch-auth-status
