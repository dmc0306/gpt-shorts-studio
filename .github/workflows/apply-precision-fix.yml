name: Apply precision search compile repairs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-precision-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Restore original search state parser and UI
        run: python3 tool/patch_precision_compile_fix.py
      - name: Commit corrected archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Fix source matching state and retry signed APK checks"
          git push
