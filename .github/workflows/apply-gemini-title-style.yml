name: Package Gemini short title style into Android source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gemini-title-style.yml'
      - 'tool/patch_gemini_title_style.py'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Package source ZIP update
        run: python3 tool/patch_gemini_title_style.py
      - name: Commit updated source archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Package v0.21.23 Gemini viral Korean titles"
          git push
