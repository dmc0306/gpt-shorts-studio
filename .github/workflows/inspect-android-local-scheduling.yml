name: Inspect Flutter activity callbacks for daily background handoff
on:
  push:
    branches: [feat/android-local-background-daily-20261114]
    paths: ['.github/workflows/inspect-android-local-scheduling.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q shorts-studio-source.zip -d app
          cd app
          echo '== MAIN TOP =='
          sed -n '1,145p' lib/main.dart
          echo '== AUTO BATCH TOP =='
          sed -n '1,130p' lib/auto_batch.dart
          echo '== AUTOBATCH BUILD =='
          grep -nE 'Widget build|void initState|Future<void> load|Future<void> start' lib/auto_batch.dart
          sed -n '300,400p' lib/auto_batch.dart
