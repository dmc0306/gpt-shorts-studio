name: Inspect precise headless paths
on:
  push:
    branches: [feat/android-local-background-daily-20261114]
    paths: ['.github/workflows/inspect-android-local-scheduling.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q shorts-studio-source.zip -d app
          cd app
          echo '=== YOUTUBE AUTH TOKEN ==='
          sed -n '268,360p' native/android/YouTubeChromeAuth.kt
          echo '=== YOUTUBE DART ==='
          sed -n '1,280p' lib/youtube.dart
          echo '=== AUTO FINISH ==='
          sed -n '125,300p' lib/auto_batch.dart
          echo '=== GEMINI GENERATE ==='
          sed -n '184,248p' lib/ai.dart
          echo '=== DOWNLOADER INTERFACE ==='
          grep -n 'Future<.*download\|download(' lib/tiktok_download.dart | head
          echo '=== DISCOVERY INTERFACE ==='
          grep -n 'Future<.*discover\|discover(' lib/discovery.dart | head
