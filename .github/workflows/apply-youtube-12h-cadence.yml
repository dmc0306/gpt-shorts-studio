name: Package Android 12-hour YouTube cadence
on:
  push:
    branches: [main]
    paths:
      - 'tool/patch_youtube_12h_cadence.py'
      - '.github/workflows/apply-youtube-12h-cadence.yml'
permissions: {contents: write}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Patch shipped Android Flutter source ZIP
        run: python3 tool/patch_youtube_12h_cadence.py
      - name: Commit updated Android app source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && exit 0
          git commit -m "Package Shorts Studio Android 12-hour YouTube publish option"
          git push
