name: Apply clean one-click candidate verifier
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-candidate-clean.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and integrate fixed Flutter source
        run: python3 tool/patch_candidate_clean.py
      - name: Commit source ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Ship single clean OneClickExplorer and bounded provider errors"
          git push
