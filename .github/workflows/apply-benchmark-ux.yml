name: Package simplified benchmark UX
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-benchmark-ux.yml'
      - 'tool/patch_benchmark_ux.py'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply source ZIP patch
        run: python3 tool/patch_benchmark_ux.py
      - name: Commit updated versioned ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorts-studio-source.zip
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Package v0.21.20 simplified benchmark UX"
          git push
